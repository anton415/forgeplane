# Verifies that no dependency uses a strict copyleft license incompatible with
# Apache 2.0 distribution. Prints the full license table for visibility, then
# fails the job if any GPL/AGPL/LGPL-family license is found.
name: License check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license-check:
    name: Check dependency licenses
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync project dependencies (locked)
        run: uv sync --frozen

      - name: Install pip-licenses into project venv
        run: uv pip install pip-licenses

      - name: Print full license report
        run: uv run pip-licenses --format=markdown --with-urls --with-authors

      - name: Fail on strict copyleft licenses (GPL / AGPL / LGPL)
        run: >
          uv run pip-licenses --fail-on
          "GNU General Public License (GPL);GNU General Public License v2 (GPLv2);GNU General Public License v3 (GPLv3);GNU General Public License v2 or later (GPLv2+);GNU General Public License v3 or later (GPLv3+);GNU Affero General Public License v3;GNU Affero General Public License v3 or later (AGPLv3+);GNU Lesser General Public License v2 (LGPLv2);GNU Lesser General Public License v2 or later (LGPLv2+);GNU Lesser General Public License v3 (LGPLv3);GNU Lesser General Public License v3 or later (LGPLv3+)"
