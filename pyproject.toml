# Core package metadata used by build tools and package indexes.
[project]
name = "forgeplane"
version = "0.1.0"
description = "CLI tool for generating API specs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
authors = [
    { name = "Anton Serdyuchenko", email = "anton415@gmail.com" },
]
keywords = ["api", "openapi", "specification", "cli", "documentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Runtime dependencies needed by the Forgeplane CLI.
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "typer>=0.26.2",
]

# Project URLs surfaced on PyPI and other package indexes.
[project.urls]
Homepage = "https://github.com/anton415/forgeplane"
Repository = "https://github.com/anton415/forgeplane"
Issues = "https://github.com/anton415/forgeplane/issues"

# Console entry point installed as the `forgeplane` command.
[project.scripts]
forgeplane = "forgeplane.cli:app"

# Hatchling builds the package from the src-layout project.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Include only the forgeplane package when building wheels.
[tool.hatch.build.targets.wheel]
packages = ["src/forgeplane"]

# Explicit sdist exclusions (issue #76). Hatchling already skips VCS-ignored
# files when building from a git checkout, but these project-controlled rules
# also hold when building from a plain directory (an exported tarball, a CI
# cache) and cover local-only tool state that must never reach a release
# artifact. Patterns use .gitignore syntax; unanchored entries match at any
# depth. `scripts/check_sdist.sh` (run via `make check-sdist`) verifies the
# built archive against this same deny list before a release.
[tool.hatch.build.targets.sdist]
exclude = [
    # Local AI tool worktrees, settings, and session metadata.
    ".claude/",
    # Real environment files; the committed .env.example template still ships.
    ".env",
    ".env.local",
    # Virtual environments.
    ".venv/",
    # Build leftovers from previous runs.
    "dist/",
    "build/",
    "wheels/",
    "*.egg-info",
    # Bytecode and tool caches.
    "__pycache__/",
    ".pytest_cache/",
    ".mypy_cache/",
    ".ruff_cache/",
    # Coverage artifacts.
    ".coverage",
    "coverage.xml",
    "htmlcov/",
    # Scan reports produced by `forgeplane scan --output-dir reports/`.
    "reports/",
]

# Strict type checking keeps the source tree fully annotated.
[tool.mypy]
strict = true

# Ruff owns formatting plus fast static linting before mypy runs.
[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Typer does not yet unwrap PEP 695 type aliases at runtime, so keep TypeAlias.
ignore = ["UP040"]

# Development-only tools used for local checks and CI.
[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pandas-stubs>=3.0.3.260530",
    "pytest>=8.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
    "types-pyyaml>=6.0.12.20260518",
]

# Run pytest against the tests/ directory by default.
[tool.pytest.ini_options]
testpaths = ["tests"]

# Coverage is measured for the forgeplane package only so the reported
# percentage reflects library code, not the test suite itself. branch = true
# also tracks which side of every if/else fires, which catches dead arms that
# line coverage alone would miss.
[tool.coverage.run]
source = ["src/forgeplane"]
branch = true

# Lines matching these patterns are excluded from the coverage report: the
# explicit ``pragma: no cover`` opt-out, stubs that raise NotImplementedError,
# and TYPE_CHECKING blocks that only run during static analysis.
[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
