# Core package metadata used by build tools and package indexes.
[project]
name = "forgeplane"
version = "0.1.0"
description = "CLI tool for generating API specs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
authors = [
    { name = "Anton Serdyuchenko", email = "anton415@gmail.com" },
]
keywords = ["api", "openapi", "specification", "cli", "documentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Runtime dependencies needed by the Forgeplane CLI.
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.26.2",
]

# Project URLs surfaced on PyPI and other package indexes.
[project.urls]
Homepage = "https://github.com/anton415/forgeplane"
Repository = "https://github.com/anton415/forgeplane"
Issues = "https://github.com/anton415/forgeplane/issues"

# Console entry point installed as the `forgeplane` command.
[project.scripts]
forgeplane = "forgeplane.cli:app"

# Hatchling builds the package from the src-layout project.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Include only the forgeplane package when building wheels.
[tool.hatch.build.targets.wheel]
packages = ["src/forgeplane"]

# Strict type checking keeps the source tree fully annotated.
[tool.mypy]
strict = true

# Development-only tools used for local checks and CI.
[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=8.4.0",
    "pytest-cov>=7.1.0",
    "types-pyyaml>=6.0.12.20260518",
]

# Run pytest against the tests/ directory by default.
[tool.pytest.ini_options]
testpaths = ["tests"]

# Coverage is measured for the forgeplane package only so the reported
# percentage reflects library code, not the test suite itself. branch = true
# also tracks which side of every if/else fires, which catches dead arms that
# line coverage alone would miss.
[tool.coverage.run]
source = ["src/forgeplane"]
branch = true

# Lines matching these patterns are excluded from the coverage report: the
# explicit ``pragma: no cover`` opt-out, stubs that raise NotImplementedError,
# and TYPE_CHECKING blocks that only run during static analysis.
[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
